name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Xcode project matches generator
        run: python3 scripts/generate-xcode-project.py && git diff --exit-code -- Stampede.xcodeproj
      - name: Test history, monitoring, and encrypted persistence
        run: swift test
      - name: Build native macOS application
        run: xcodebuild -project Stampede.xcodeproj -scheme Stampede -configuration Release -derivedDataPath .build/XcodeDerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build and sign installable app bundle
        run: ./scripts/build-app.sh
      - name: Verify app bundle signature
        run: codesign --verify --strict --verbose=2 build/Stampede.app
      - name: Test native clipboard integration
        run: build/Stampede.app/Contents/MacOS/Stampede --self-test
